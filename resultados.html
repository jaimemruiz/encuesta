<!DOCTYPE html>
<html lang="es">


<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap"
    rel="stylesheet">
  <title>Resultados</title>
  <link rel="icon" type="image/png" href="./2279034.png">
</head>

<body>

  <header>
    Panel de Resultados
  </header>

  <main>
    <form id="form-login">
      <h2>Iniciar Sesión</h2>
      <div class="grupo-encuesta">
        <label for="email">Correo:</label>
        <input type="email" id="email" required>
      </div>
  
        <label for="password">Contraseña:</label>
        <div class="grupo-contra">
          <input class="password" type="password" id="password" required>

          <input class="mostrar" type="checkbox" id="mostrar">
          <label for="mostrar">👁️‍🗨️ </label>
        </div>
      <button type="submit">Entrar</button>
    </form>

    <div id="seccion-resultados" style="display: none;">
      <h2>Respuestas Recibidas</h2>
      <table id="tabla-datos">
        <!-- Aquí pintaremos los datos con JavaScript -->
      </table>
    </div>
  </main>

  <!-- Carga el SDK global de Supabase sin módulos -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Carga tu script -->
  <script src="admin.js"></script>
</body>

</html>
</body>

</html>
