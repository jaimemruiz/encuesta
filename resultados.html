<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap"
    rel="stylesheet">
  <title>Resultados</title>
  <link rel="icon" type="image/png" href="./2279034.png">
</head>

<body>

  <header>
    Panel de Resultados
  </header>

  <main>
    <!-- Formulario de Inicio de Sesión -->
    <form id="form-login">
      <h2>Iniciar Sesión</h2>
      
      <div class="grupo-encuesta">
        <label for="email">Correo:</label>
        <input type="email" id="email" required>
      </div>
  
      <label for="password">Contraseña:</label>
      <div class="grupo-contra">
        <input class="password" type="password" id="password" required>
        <input class="mostrar" type="checkbox" id="mostrar">
        <label for="mostrar" style="margin-bottom: 0; cursor: pointer;">👁️‍🗨️</label>
      </div>

      <button type="submit">Entrar</button>
    </form>

    <!-- Sección de Resultados (Oculta hasta hacer login) -->
    <div id="seccion-resultados" style="display: none; width: 100%;">
      <h2>Respuestas Recibidas</h2>
      <div style="overflow-x: auto;">
        <table id="tabla-datos">
          <thead>
            <tr>
              <th>Edad</th>
              <th class="top">Profesión</th>
              <th>Dispositivo</th>
              <th>Problema</th>
              <th>Solución Actual</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="cuerpo-tabla">
            <!-- Los datos se pintarán aquí automáticamente con JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- SDK global de Supabase y tu script de administración -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>

</html>
